name: Collect ingredients (원재료 분할 수집)

# 식품안전나라 C002 는 품목보고번호 조회를 '1시간당 100회'로 제한한다 (INFO-320).
# (CHNG_DT 증분 조회는 최근 7일만 가능 → 과거분 일괄 수집 불가)
# → 매시간 95건씩, 페르소나가 많이 볼 제품부터 수집. 약 2.2만 건 = 약 10일. 다 모이면 '변경 없음'으로 빨리 끝남.
on:
  schedule:
    - cron: "17 * * * *"   # 매시간
  workflow_dispatch:
    inputs:
      probe:
        description: "API 파라미터 점검만 (4회 호출)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다리는 동안 다른 데이터 커밋이 생겨도 최신본에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: ${{ inputs.probe }}
        env:
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: python3 scripts/ingredients.py --probe
      - name: Ingredients (시간당 95건)
        if: ${{ !inputs.probe }}
        env:
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: python3 scripts/ingredients.py --workers 2 --limit 95 --max-minutes 15 | tail -3 | tee ingr.log
      - name: Normalize
        if: ${{ !inputs.probe }}
        run: python3 scripts/normalize.py | tee normalize.log
      - name: Commit
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ingredients data/processed web/public/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 원재료 분할 수집 $(date +%F)" -m "$(cat ingr.log normalize.log)"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
