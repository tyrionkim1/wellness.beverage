name: Collect ingredients (원재료 분할 수집)

# 원재료 API는 건당 1~2초라 한 번에 2만 건을 돌리면 몇 시간 걸린다.
# 40분씩 끊어서 수집하고 그때마다 커밋 → 중간에 끊겨도 진행분이 남는다. 다 모이면 '변경 없음'으로 빨리 끝남.
on:
  schedule:
    - cron: "30 */2 * * *"   # 2시간마다
  workflow_dispatch:
    inputs:
      probe:
        description: "API 파라미터 점검만 (4회 호출)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다리는 동안 다른 데이터 커밋이 생겨도 최신본에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: ${{ inputs.probe }}
        env:
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: python3 scripts/ingredients.py --probe
      - name: Ingredients (40분 제한)
        if: ${{ !inputs.probe }}
        env:
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: python3 scripts/ingredients.py --workers 4 --max-minutes 40 | tail -3 | tee ingr.log
      - name: Normalize
        if: ${{ !inputs.probe }}
        run: python3 scripts/normalize.py | tee normalize.log
      - name: Commit
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ingredients data/processed web/public/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 원재료 분할 수집 $(date +%F)" -m "$(cat ingr.log normalize.log)"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
