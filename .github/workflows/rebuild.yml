name: Rebuild data (images · caffeine)

# 팀원이 data/images/sources.csv(이미지 URL) 또는 data/samples/caffeine_labels.csv(카페인)를
# 고쳐서 올리면 자동으로 누끼 처리 + 웹 데이터 재생성
on:
  push:
    branches: [main]
    paths:
      - data/images/sources.csv
      - data/samples/caffeine_labels.csv
      - data/samples/taste_notes.csv
      - scripts/normalize.py
      - scripts/images.py
      - data/brands/major.csv
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1
      - name: Install
        run: pip install "rembg[cpu]" pillow
      - name: Images (누끼)
        env:
          U2NET_HOME: /home/runner/.u2net
        run: python3 scripts/images.py | tee images.log
      - name: Normalize
        run: python3 scripts/normalize.py | tee normalize.log
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/images data/processed web/public
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 이미지·카페인 반영 $(date +%F)" -m "$(cat images.log normalize.log)"
          git pull --rebase -X theirs origin main
          git push
