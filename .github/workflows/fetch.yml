name: Fetch MFDS data

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch raw (음료류)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_raw.py
      - name: Normalize (1차 — 웹 데이터 갱신)
        run: python3 scripts/normalize.py
      - name: Ingredients (새 품목보고번호만)
        continue-on-error: true   # 원재료 API 장애가 영양성분 갱신을 막지 않게
        env:
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: python3 scripts/ingredients.py --workers 4 | tail -3
      - name: Normalize (원재료 태그 반영)
        run: python3 scripts/normalize.py | tee normalize.log
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/raw data/processed data/ingredients web/public/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 식약처 음료류 수집 $(date +%F)" -m "$(cat normalize.log)"
          git push
